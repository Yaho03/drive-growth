<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>르르렌트카 · 사선 마을 · 움직임과 줌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
/* 한 화면 게임 UI: 위 상태 바 · 가운데 화면 · 아래 탐색. 2차 시안 A의 어두운 둥근 카드와 파란 주요 버튼 */
:root{
  color-scheme:dark;
  --bg:#151a28; --card:rgba(18,22,34,.94); --card2:#1d2335; --line:#2c3349;
  --fg:#ffffff; --mut:#aab3c5; --accent:#2f6fe8; --accent-fg:#ffffff;
  --ok:#7ee2a6; --ok-bg:#1f3a2c; --warn:#ffd36b; --warn-bg:#3d3216; --bad:#ff9a8a; --bad-bg:#4a2026;
  --info:#9cc2ff; --info-bg:#1e2f57; --teal:#7fd8cf; --teal-bg:#173c3c;
  --r-common:#d6dce6; --r-adv:#68a0f0; --r-rare:#f08caa; --r-legend:#fcdc64;
  --font:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,select:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.px{image-rendering:pixelated}
.app{max-width:1360px;margin:0 auto;padding-block:12px 16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title{font-size:clamp(22px,2.4vw,30px);font-weight:900;margin:0}
.money{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:10px 18px;font-size:clamp(20px,2.2vw,28px);font-weight:900;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2a8,#fcdc64 45%,#c86e28);box-shadow:0 0 0 2px #6e4a38 inset;flex:none}
.coin.s{width:16px;height:16px}
.screen{flex:1;min-height:0}
.card{background:var(--card);border-radius:22px;padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.mut{color:var(--mut)}
.h2{font-size:22px;font-weight:900;margin:0}
.btn{min-height:52px;padding:0 22px;border-radius:14px;font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--line)}
.btn.p{background:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:2px 12px;border-radius:16px;font-size:15px;font-weight:700;white-space:nowrap}
.st-idle{background:var(--ok-bg);color:var(--ok)} .st-repair{background:var(--bad-bg);color:var(--bad)}
.st-rest{background:#2c3141;color:#c3c9d6} .st-rent{background:var(--info-bg);color:var(--info)}
.rar{border:2px dashed var(--r-common);color:#e8ecf3}
.rar.advanced{border:2px solid var(--r-adv);color:var(--info)}
.rar.rare{border:4px double var(--r-rare);color:var(--r-rare)}
.rar.legend{border:3px solid var(--r-legend);color:var(--r-legend);box-shadow:0 0 10px rgba(252,220,100,.45)}
.nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--card);border-radius:20px;padding:8px}
.nav button{min-height:56px;border-radius:14px;font-weight:700;font-size:16px;color:var(--mut)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff}
.notice{border-radius:16px;padding:12px 16px;font-weight:700}
.notice.warn{background:var(--warn-bg);color:var(--warn)} .notice.bad{background:var(--bad-bg);color:var(--bad)} .notice.info{background:var(--info-bg);color:var(--info)}
.bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:60px}
.bar>div{height:100%;background:#68a0f0}
/* 지도 */
.map{position:relative;width:100%;aspect-ratio:3/2;border-radius:22px;overflow:hidden;container-type:inline-size;background:#86c05a;max-width:100%}
.map img{position:absolute;display:block;max-width:none}
.map .full{inset:0;width:100%;height:100%}
.map .sign{position:absolute;color:#fcdc64;font-weight:900;text-align:center;white-space:nowrap;transform-origin:0 0;line-height:1;text-shadow:0 1px 0 #1c1e2c}
.hud{position:absolute;display:flex;gap:8px;align-items:center;background:rgba(18,22,34,.9);border-radius:14px;padding:6px 12px;font-weight:700;font-size:clamp(12px,1.6cqw,18px)}
.ring{position:absolute;border-radius:50%;pointer-events:none}
.ring.common{border:2px dashed var(--r-common)} .ring.advanced{border:2px solid var(--r-adv);box-shadow:0 0 8px var(--r-adv)}
.ring.rare{border:4px double var(--r-rare)} .ring.legend{border:3px solid var(--r-legend);box-shadow:0 0 12px var(--r-legend)}
.slotbtn{position:absolute;border-radius:12px}
.shop{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.shop{grid-template-columns:1fr}}
/* 차 그림 */
.carpic{position:relative;height:120px;display:grid;place-items:center}
.carpic img{width:168px;height:auto}
.carpic .ring{width:150px;height:56px;left:50%;top:62%;transform:translate(-50%,-50%)}
.cars{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.slot-empty{border:3px dashed var(--line);border-radius:22px;display:grid;place-items:center;text-align:center;padding:18px;min-height:220px;color:var(--mut)}
.dex{overflow-x:auto}
.dex table{border-collapse:separate;border-spacing:6px;min-width:620px}
.dex td,.dex th{text-align:center}
.dex th{font-size:14px;color:var(--mut);font-weight:700}
.dexcell{width:110px;height:70px;border-radius:12px;background:var(--card2);display:grid;place-items:center;position:relative}
.dexcell img{width:84px}
.dexcell.unseen img{filter:brightness(0);opacity:.55}
.dexcell.seen img{filter:grayscale(1) brightness(.85);opacity:.7}
.dexcell .q{position:absolute;font-weight:900;font-size:22px;color:var(--mut)}
.tools{border:2px dashed #3a4258;background:transparent}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card2);border-radius:16px;padding:12px 16px;flex-wrap:wrap}
.item>div{min-width:0}
.overlay{position:fixed;inset:0;background:rgba(5,8,15,.72);display:grid;place-items:center;padding:20px;z-index:20}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto}
.big{font-size:clamp(28px,4vw,44px);font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0d111c;border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--card2);font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .45s ease-out}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}}
.scenery{pointer-events:none}.facility-label{position:absolute;background:#1c1e2c;color:#e8d6b4;padding:3px 7px;border-radius:5px;font-size:clamp(10px,1.6cqw,15px)}
</style>

<script>
const IMG = {ground:"assets/legacy-35645153652c.png", cover1:"assets/legacy-f2a78b46b729.png", cover2:"assets/legacy-6e5d370b01ab.png", cover3:"assets/legacy-97109a3e84aa.png",
  b1:"assets/legacy-2e49efeedec6.png", b2:"assets/legacy-bc756f763c76.png", staff:"assets/legacy-c326d4f9ffd3.png",
  light:"assets/legacy-16deb50aeab2.png", sedan:"assets/legacy-cab84d9fef8c.png", suv:"assets/legacy-aff1cd414e6b.png", van:"assets/legacy-827c9c5f7c09.png", luxury:"assets/legacy-b64feb502231.png"};
const SPR = {light:[56,51], sedan:[66,46], suv:[69,58], van:[73,64], luxury:[73,48]};
Object.assign(IMG,{"b1": "assets/legacy-71ebe9d0a519.png", "b2": "assets/legacy-a6e4310f38ef.png", "fuel": "assets/legacy-ff669785a3bc.png", "insurance": "assets/legacy-dc9ec925416b.png", "손님 A": "assets/legacy-6b120a461ce7.png", "정비사 A": "assets/legacy-c64134e8756b.png", "주유소 직원 A": "assets/legacy-c64e341a7d95.png", "rururu": "assets/legacy-a98ceea055bf.gif", "genesis_gv80": "assets/genesis_gv80_se.png", "hyundai_palisade": "assets/hyundai_palisade_se.png", "hyundai_santafe": "assets/hyundai_santafe_se.png", "hyundai_kona": "assets/hyundai_kona_se.png", "hyundai_avante": "assets/hyundai_avante_se.png", "hyundai_casper": "assets/hyundai_casper_se.png", "hyundai_grandeur": "assets/hyundai_grandeur_se.png", "hyundai_staria_tourer": "assets/hyundai_staria_tourer_se.png", "hyundai_ioniq6": "assets/hyundai_ioniq6_se.png", "hyundai_nexo": "assets/hyundai_nexo_se.png", "hyundai_venue": "assets/hyundai_venue_se.png", "hyundai_casper_electric": "assets/hyundai_casper_electric_se.png", "genesis_gv70": "assets/genesis_gv70_se.png", "hyundai_ioniq9": "assets/hyundai_ioniq9_se.png", "hyundai_ioniq5": "assets/hyundai_ioniq5_se.png", "genesis_g90": "assets/genesis_g90_se.png", "genesis_g80": "assets/genesis_g80_se.png", "hyundai_sonata": "assets/hyundai_sonata_se.png", "hyundai_tucson": "assets/hyundai_tucson_se.png", "hyundai_staria_lounge": "assets/hyundai_staria_lounge_se.png"});
IMG.isoTown="assets/town.png";
const RURU_FRAMES={"idle": ["assets/rururu_se_idle5.png", "assets/rururu_se_idle5.png", "assets/rururu_se_idle3.png", "assets/rururu_se_idle4.png", "assets/rururu_se_idle5.png", "assets/rururu_se_idle5.png"], "walk": ["assets/rururu_se_walk1.png", "assets/rururu_se_walk2.png", "assets/rururu_se_walk3.png", "assets/rururu_se_walk4.png", "assets/rururu_se_walk5.png", "assets/rururu_se_walk6.png", "assets/rururu_se_walk7.png", "assets/rururu_se_walk8.png"]};
const SLOTS = [{"x": 253, "y": 635}, {"x": 326, "y": 672}, {"x": 400, "y": 709}, {"x": 474, "y": 745}, {"x": 548, "y": 781}, {"x": 984, "y": 758}, {"x": 1063, "y": 796}, {"x": 1142, "y": 835}, {"x": 1220, "y": 873}, {"x": 1299, "y": 912}];
const BUILD = {"main_lv1": {"left": 339, "top": 101, "w": 196, "h": 129, "sign": [[356.0, 136.79999999999995], [408.80000000000007, 163.2], [408.80000000000007, 155.2], [356.0, 128.79999999999995]]}, "main_lv2": {"left": 339, "top": 101, "w": 260, "h": 161, "sign": [[356.0, 136.79999999999995], [424.80000000000007, 171.2], [424.80000000000007, 161.2], [356.0, 126.79999999999995]]}};

// ── 콘텐츠(PRD 시험값) ──
const MODELS = [
 ["hyundai_casper","캐스퍼",100,1,"light",0],["hyundai_venue","베뉴",110,1,"light",95],["hyundai_kona","코나",130,1,"suv",-25],
 ["hyundai_avante","아반떼",120,1,"sedan",0],["hyundai_sonata","쏘나타",150,1,"sedan",200],["hyundai_tucson","투싼",150,1,"suv",0],
 ["hyundai_staria_tourer","스타리아 투어러",170,1,"van",160],["hyundai_casper_electric","캐스퍼 일렉트릭",130,1,"light",170],
 ["hyundai_grandeur","그랜저",200,2,"sedan",120],["hyundai_santafe","싼타페",180,2,"suv",60],["hyundai_staria_lounge","스타리아 라운지",200,2,"van",0],
 ["hyundai_ioniq5","아이오닉 5",180,2,"suv",250],["hyundai_ioniq6","아이오닉 6",180,2,"sedan",300],["hyundai_nexo","넥쏘",220,2,"suv",140],
 ["genesis_g80","G80",240,3,"luxury",0],["hyundai_palisade","팰리세이드",230,3,"suv",320],["genesis_gv70","GV70",240,3,"suv",200],
 ["hyundai_ioniq9","아이오닉 9",250,3,"van",280],["genesis_g90","G90",300,4,"luxury",180],["genesis_gv80","GV80",280,4,"suv",100]
].map(([id,name,ratio,unlock,type,hue])=>({id,name,ratio,unlock,type,hue,price:Math.floor(1000*ratio/100)}));
const M = Object.fromEntries(MODELS.map(m=>[m.id,m]));
const RAR = [
 {k:"common",n:"일반",w:747,inc:1.0,cost:100,prog:100},{k:"advanced",n:"고급",w:200,inc:1.1,cost:105,prog:150},
 {k:"rare",n:"희귀",w:50,inc:1.2,cost:110,prog:250},{k:"legend",n:"전설",w:3,inc:1.3,cost:115,prog:400}];
const R = Object.fromEntries(RAR.map(r=>[r.k,r]));
const CAP = {1:3,2:5,3:7,4:10};
const EXPAND = {2:{cust:3,cost:500},3:{cust:10,cost:1500},4:{cust:25,cost:3000}};
const TICKET = 500, PITY = 30, KM_PAY = 10, KM_CAP = 500;
const DEST = [{k:"mart",n:"마트",km:4,band:"근거리"},{k:"school",n:"학교",km:18,band:"중거리"},{k:"home",n:"본가",km:46,band:"원거리"}];

<script src="town-runtime.js"></script>
<script>
// ── 상태 ──
let S, seq = 0;
function fresh(){ return {started:false, money:0, level:1, customers:0, earned:0, km:0, kmToday:0, day:1,
  cars:[], hold:null, dex:{}, free:0, pity:0, gifted:false, firstRental:false, unread:[], log:[], delivery:null, offers:null, dest:null}; }
function save(){ try{ localStorage.setItem("rentShop_iso_v2_preview", JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem("rentShop_iso_v2_preview")); if(v && v.cars) return v; }catch(e){} return null; }
S = load() || fresh();
seq = S.cars.reduce((a,c)=>Math.max(a,+c.id.split("-")[1]||0),0);

const won = n => n.toLocaleString("ko-KR");
const cap = () => CAP[S.level];
const unlocked = () => MODELS.filter(m=>m.unlock<=S.level);
const see = (model,rar,owned) => { const k=model+"|"+rar; if(owned) S.dex[k]="owned"; else if(!S.dex[k]) S.dex[k]="seen"; };
function addCar(model,rar,cost,src){ const c={id:"car-"+(++seq),model,rar,lv:1,prog:0,acc:0,cost,st:"idle",rest:false,src};
  see(model,rar,true); if(S.cars.length<cap()){ S.cars.push(c); return "garage"; } S.hold={car:c,day:S.day}; return "hold"; }
function income(src,amount,text){ if(amount>0){ S.money+=amount; S.earned+=amount; } S.unread.push({src,amount,text}); }

// ── 규칙(PRD 시험값) ──
const lvCost = c => Math.floor(M[c.model].price*2*c.lv*R[c.rar].cost/10000);
const repairCost = c => Math.floor(M[c.model].price*5*R[c.rar].cost/10000);
const salePct = c => Math.max(60-5*c.acc,30) + (c.lv-1);
const salePrice = c => Math.floor(c.cost*salePct(c)/100);
const scrapPrice = c => Math.floor(c.cost*20/100);
function gainProg(c,pct){ let p=c.prog+pct; while(p>=100 && c.lv<20){ p-=100; c.lv++; } c.prog = c.lv>=20?0:p; }
function rollRar(){ if(S.pity>=PITY-1){ return Math.random()<50/53?"rare":"legend"; }
  let x=Math.random()*1000; for(const r of RAR){ if((x-=r.w)<0) return r.k; } return "common"; }

// ── 화면 공통 ──
const NAV = [["shop","가게"],["garage","차고"],["dex","도감"],["gacha","뽑기"],["delivery","탁송"],["settle","정산"],["rank","랭킹"]];
let view = "shop", detailId = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function carImg(model,cls="px"){ const m=M[model]; return `<img class="${cls}" src="${(IMG[m.id]||IMG[m.type])}" alt="${esc(m.name)}" style="filter:hue-rotate(0deg)">`; }
function rarChip(k){ return `<span class="chip rar ${k}">${R[k].n}</span>`; }
function stChip(c){ if(c.st==="repair") return `<span class="chip st-repair">수리 필요</span>`;
  if(c.rest) return `<span class="chip st-rest">영업 쉬기</span>`; return `<span class="chip st-idle">대기</span>`; }
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
function modal(html){ $("#layer").innerHTML=`<div class="overlay" id="ov"><div class="card modal pop" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeModal(); }); }
function closeModal(){ $("#layer").innerHTML=""; }
function go(v){ view=v; detailId=null; townFocus=null; render(); window.scrollTo(0,0); }

function render(){
  cancelAnimationFrame(townRAF);
  save();
  $("#money").textContent = won(S.money);
  if(!S.started){ $("#nav").hidden=true; $("#scrTitle").textContent="첫 실행"; return renderOnboarding(); }
  $("#nav").hidden=false;
  $("#nav").innerHTML = NAV.map(([k,n])=>`<button data-go="${k}" ${view===k||(view==="detail"&&k==="garage")?'aria-current="page"':""}>${n}${k==="settle"&&S.unread.length?` · ${S.unread.length}`:""}</button>`).join("");
  const titles={shop:"가게",garage:"차고",detail:"차량 상세",dex:"도감",gacha:"뽑기",delivery:"탁송",settle:"정산",rank:"랭킹"};
  $("#scrTitle").textContent = titles[view];
  ({shop:renderShop,garage:renderGarage,detail:renderDetail,dex:renderDex,gacha:renderGacha,delivery:renderDelivery,settle:renderSettle,rank:renderRank})[view]();
  if(view==="shop") mountTown();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-go],[data-act]"); if(!b || b.disabled) return;
  if(b.dataset.go){ go(b.dataset.go); return; }
  ACT[b.dataset.act](b.dataset.arg, b);
});

// ── ⑦ 첫 실행 ──
let ob = {step:0, pick:"hyundai_casper"};
function renderOnboarding(){
  const s=$("#screen");
  if(ob.step===0) s.innerHTML=`<div class="card pop" style="max-width:640px;margin:40px auto;display:grid;gap:16px;justify-items:start">
    <div class="row"><img class="px" src="${IMG.staff}" alt="안내 직원" style="width:48px"><span class="mut">안내 직원</span></div>
    <div class="big">어서 오세요, 사장님!</div>
    <p class="mut" style="margin:0;font-size:18px;line-height:1.6">오늘부터 이 렌터카 가게를 맡게 되었어요. 차를 모아 빌려주고, 가게를 조금씩 키워 봐요. 먼저 첫 차를 한 대 골라 볼까요?</p>
    <button class="btn p" data-act="obNext">시작하기</button></div>`;
  if(ob.step===1) s.innerHTML=`<div style="display:grid;gap:16px;max-width:900px;margin:0 auto"><div><div class="h2">첫 차를 골라 주세요</div><div class="mut">둘 다 일반 등급 · Lv1로 시작해요</div></div>

     ${row(max?"레벨업 · 최대 Lv20":`레벨업 · Lv${c.lv} → Lv${c.lv+1}`, `${won(m.price)} × 2% × Lv${c.lv} × ${R[c.rar].n} ${R[c.rar].cost/100}`, max?null:lvCost(c),

     ${row("수리", busyRepair?`${won(m.price)} × 5% × ${R[c.rar].cost/100}`:"지금은 수리할 곳이 없어요", repairCost(c),

function makeOffers(d, downgrade){
  const pool=unlocked(), pick=()=>pool[Math.floor(Math.random()*pool.length)];
  const rar=()=>{ let k=rollRarSimple(); if(downgrade){ const i=RAR.findIndex(r=>r.k===k); k=RAR[Math.max(0,i-1)].k; } return k; };
  return [0,1,2,3].map(i=>{ const m=pick(), r=rar(), kind=i<2?"profit":"buy";
    see(m.id,r,false);
    return {id:"o"+Date.now()+i, kind, model:m.id, rar:r, km:d.km, dest:d.n,
      reward: kind==="profit"? Math.round((80 + d.km*8)*R[r].inc/10)*10 : null,
      price: kind==="buy"? Math.round(m.price*(1+RAR.findIndex(x=>x.k===r)*.25)/10)*10 : null}; });
}
function rollRarSimple(){ let x=Math.random()*1000; for(const r of RAR){ if((x-=r.w)<0) return r.k; } return "common"; }

  return {level:S.level, dex:Object.values(S.dex).filter(v=>v==="owned").length, cars:S.cars.length, earned:S.earned, km:S.km, best:Math.round(best), bestCar}; }
const SAMPLE = {level:[["드라이브왕",4],["새벽주차",3],["주말기사",3],["출퇴근러",1]], dex:[["드라이브왕",41],["새벽주차",27],["주말기사",12],["출퇴근러",5]],

function renderRank(){
  const me=myStats(), tabs=[["level","가게 레벨"],["dex","도감 수집 수"],["cars","보유 차량 수"],["earned","누적 게임머니"],["km","주행거리"],["best","가장 비싼 차"]];

    </div>
    <div class="card list"><div class="row" style="justify-content:space-between"><div class="h2">${tabs.find(t=>t[0]===rankTab)[1]} 순위</div><span class="chip" style="background:var(--warn-bg);color:var(--warn)">예시 데이터 · 시연용</span></div>
      ${rankTab==="best"?`<div class="mut" style="font-size:14px">차종 가격 × 희귀도 수익 배율로 계산해요</div>`:""}
      ${rows.map(r=>`<div class="item" style="${r.me?"border:2px solid var(--accent)":""}"><b style="min-width:70px">${r.tie?"공동 ":""}${r.rank}위</b><span style="flex:1">${esc(r.n)}</span><b>${fmt[rankTab](r.v)}</b></div>`).join("")}

const canMotion = () => typeof window.playMotion === "function";
function gachaMotion(kind, r, m, isNew, guaranteed, pityBefore){
  window.playMotion("gacha", {tier:TIER_OF[r], name:m.name, car:carData(m.id), isNew, guaranteed, price:kind==="free"?"무료권":String(TICKET),
    pity:`희귀 이상 보장까지 ${PITY-pityBefore}회`, pityAfter:`다음 보장까지 ${PITY-S.pity}회`,
    againPrice: S.free>0?"무료권":String(TICKET),

    onAgain:()=>{ window.closeMotion(); ACT.pull(S.free>0?"free":"paid"); },
    onGarage:()=>{ window.closeMotion(); go("garage"); }});

  arrive(){ const d=S.delivery; if(!d) return; const o=d.offer, m=M[o.model];

    else { const where=addCar(o.model,o.rar,d.paid,"구매 탁송"); const text=`${m.name}(${R[o.rar].n}) 구매 탁송 도착 · ${where==="garage"?"차고에 들어갔어요":"차고가 꽉 차서 임시 보관함에 있어요"}`; income("delivery",0,text); S.log.push({text,amount:0}); }
    S.delivery=null; S.offers=null; toast("탁송을 마쳤어요 · 정산에서 확인하세요"); render(); },
  nextDay(){ S.day++; S.kmToday=0;

    toast(`${S.day}일째가 되었어요`); render(); },

  unhold(){ if(S.hold && S.cars.length<cap()){ S.cars.push(S.hold.car); S.hold=null; toast("차고로 옮겼어요"); render(); } },
  levelup(id){ const c=S.cars.find(x=>x.id===id), cost=lvCost(c); if(S.money<cost) return; S.money-=cost; c.lv++; if(c.lv>=20) c.prog=0; toast(`Lv${c.lv}이 되었어요`); render(); },

      <button class="btn" data-act="close">취소</button></div>`); },

    embers.push(<Sq key={'e' + i} x={x} y={600 - ph * 380} s={4 + Math.floor(rnd(i, 2) * 2) * 4} c={i % 3 ? col : C.white} o={clamp(I, 0, 1) * (ph < 0.1 ? ph * 10 : 1 - ph)} />);
  }
  const rings = [];
  if (!reduced && t >= 0.5 && t < R) for (let k = 0; k < 3; k++) {
    if (t - 0.5 < k * 0.3) continue; const ph = ((t - 0.5) / 0.9 + k / 3) % 1;
    rings.push(<Diamond key={'r' + k} cx={680} cy={712} hw={300} hh={150} col={col} sc={0.15 + ph * 1.1} o={(1 - ph) * clamp(I, 0, 1) * 0.7} />);
  }
  const twinkles = [];
  if (revealed) for (let i = 0; i < 10; i++) {
    const a = rnd(i, 60) * Math.PI * 2, d = 150 + rnd(i, 61) * 120;
    twinkles.push(<Star key={'tw' + i} x={carX + Math.cos(a) * d} y={carY - 110 + Math.sin(a) * d * 0.7} s={4} c={i % 2 ? col : C.white} o={Math.max(0, Math.sin((t - R) * 2.6 + i * 1.7)) * seg(t, R + 0.6, R + 0.9) * (reduced ? 0 : 1)} />);
  }
  const rim = { common: [[C.slate2, 4]], uncommon: [[C.blue2, 4]], rare: [[C.pink, 4], [C.pink2, 2, 0.86]], legend: [[C.gold, 6], [C.gold2, 2, 0.86], [C.goldD, 2, 1.12]] }[tier];
  const shutterSlats = [];
  for (let i = 0; i < 12; i++) shutterSlats.push(<div key={i} style={{ position: 'absolute', left: 0, right: 0, top: i * 29, height: 29, background: i % 2 ? C.gray : '#858598', boxShadow: `inset 0 3px 0 ${C.gray2}, inset 0 -3px 0 ${C.gray0}` }}></div>);
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: C.navy0 }}>
      <div style={{ position: 'absolute', inset: 0, opacity: 1 - bgO }}><div style={{ position: 'absolute', left: 180, top: 150 }}><ShopMap /></div></div>
      <div style={{ position: 'absolute', inset: 0, opacity: bgO, transform: `translate(${sx}px,${sy}px) scale(${cam})`, transformOrigin: '680px 450px' }}>
        <Backdrop />
        {/* floor spill */}
        {!revealed ? [[400, 960, 600, 0.45], [360, 1000, 650, 0.25], [320, 1040, 700, 0.12]].map(([a, b, y, o], i) => (
          <div key={'sp' + i} style={{ position: 'absolute', left: 0, top: 560, width: SW, height: y - 560 + open * 120, background: col, opacity: clamp(o * I, 0, 0.9), clipPath: `polygon(424px 0, 936px 0, ${b + open * 60}px 100%, ${a - open * 60}px 100%)` }}></div>
        )) : null}
        {rim.map(([c, w, k], i) => <Diamond key={'rim' + i} cx={carX} cy={712} hw={300 * (k || 1)} hh={150 * (k || 1)} col={revealed || i === 0 ? c : C.slate} sw={w} o={revealed ? 1 : (i === 0 ? 0.5 + 0.5 * clamp(I, 0, 1) : 0)} />)}
        {rings}
        {revealed && !reduced ? <div style={{ position: 'absolute', inset: 0, }}>
          {tier === 'legend' ? [280, 220, 160].map((r, i) => <div key={'h' + i} style={{ position: 'absolute', left: carX - r, top: carY - 110 - r * 0.9, width: r * 2, height: r * 1.8, borderRadius: '50%', background: C.gold, opacity: (0.08 + i * 0.05) * rayS * (0.85 + 0.15 * Math.sin(t * 2)) }}></div>) : null}
          {rayCfg.map(([n, c, o, sp], i) => <Rays key={'ray' + i} cx={carX} cy={carY - 110} n={n} col={c} o={o} rot={(t - R) * sp} sc={rayS} />)}
        </div> : null}
        {/* shutter unit */}
        {!revealed ? (
          <div style={{ position: 'absolute', left: 0, top: 0, width: SW, height: SH, opacity: unitO, transform: `translateY(${dropY}px) scaleY(${squash})`, transformOrigin: '680px 560px' }}>
            <div style={{ position: 'absolute', left: 400, top: 150, width: 560, height: 410, background: C.gray0, boxShadow: `0 0 0 4px ${C.ink}` }}></div>
            <div style={{ position: 'absolute', left: 424, top: 200, width: 512, height: 360, background: C.ink, overflow: 'hidden' }}>
              {[[0, 0.35], [70, 0.6], [150, 0.9]].map(([ins, o], i) => <div key={i} style={{ position: 'absolute', left: ins, right: ins, top: ins * 0.6, bottom: 0, background: i === 2 ? C.white : col, opacity: o * clamp(0.25 + open * 1.2, 0, 1) }}></div>)}
              <div style={{ position: 'absolute', left: 0, right: 0, top: 0, height: 348, overflow: 'hidden' }}>
                <div style={{ position: 'absolute', left: 0, right: 0, top: -348 * open, height: 348 }}>
                  {shutterSlats}
                  <div style={{ position: 'absolute', left: 226, width: 60, top: 322, height: 12, background: C.gray2, boxShadow: `0 0 0 3px ${C.ink}` }}></div>
                </div>
              </div>
              <div style={{ position: 'absolute', left: 0, right: 0, top: 348 - 348 * open, height: 12 + 348 * open * 0, background: col, opacity: clamp(I, 0, 1) }}></div>
            </div>
            <div style={{ position: 'absolute', left: 392, top: 140, width: 576, height: 60, background: C.gray, boxShadow: `0 0 0 4px ${C.ink}, inset 0 -8px 0 ${C.gray0}, inset 0 6px 0 ${C.gray2}` }}></div>
            {[[404, 156], [944, 156]].map(([x, y], i) => <div key={i} style={{ position: 'absolute', left: x, top: y, width: 12, height: 12, background: C.gray2, boxShadow: `0 0 0 2px ${C.ink}` }}></div>)}
            <div style={{ position: 'absolute', left: 600, top: 156, width: 160, height: 28, background: C.blue, boxShadow: `0 0 0 3px ${C.ink}`, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.white, font: `400 16px ${FPX}` }}>GARAGE</div>
          </div>
        ) : null}
        {/* landing dust */}
        {!reduced && t > 0.42 && t < 1.1 ? Array.from({ length: 18 }).map((_, i) => { const p = MOTION.enter(t, 0.42, 1.0), side = i % 2 ? 1 : -1; return <Sq key={'d' + i} x={680 + side * (280 + p * (60 + rnd(i, 7) * 140))} y={556 - p * (10 + rnd(i, 8) * 60)} s={8 + Math.floor(rnd(i, 9) * 2) * 4} c={i % 3 ? C.mist : C.slate2} o={1 - seg(t, 0.7, 1.05)} />; }) : null}
        {embers}
        {/* car */}
        <div style={{ position: 'absolute', left: carX - d.car.w * 5 * 0.45, top: carY - (d.car.h - 10) * 5 + floatY, opacity: carO, transform: `scale(${carS})`, transformOrigin: `${d.car.w * 5 * 0.45}px ${(d.car.h - 10) * 5}px` }}><OurCar car={d.car} s={5} /></div>
        {!reduced ? burst(t, R + 0.05, sparkleN, carX, carY - 110, tier === 'common' ? 200 : 330, burstCols, 11, tier !== 'common') : null}
        {tier === 'legend' && !reduced ? burst(t, R + 0.45, 32, carX, carY - 110, 460, [C.gold, C.gold2, C.white], 23, true) : null}
        {twinkles}
      </div>
      {tier === 'legend' && !reduced ? <div style={{ position: 'absolute', inset: 0 }}>{confetti(t, R + 0.1, 44, 5)}{confetti(t, R + 0.3, 14, 9, SH, [C.gold, C.gold2])}</div> : null}
      <Flash o={upFlash} c={col} />
      {!reduced ? <Flash o={flashAt(t, R, 0.85)} /> : null}
      {tier === 'legend' && !reduced ? <Flash o={t >= R + 0.45 && t < R + 0.7 ? 0.35 * (1 - (t - R - 0.45) / 0.25) : 0} c={C.gold} /> : null}
      {/* tap ripple + prompt */}
      {tapP > 0 && tapP < 1 ? <Diamond cx={680} cy={380} hw={90} hh={45} col={C.white} sw={4} sc={0.3 + tapP * 0.9} o={1 - tapP} /> : null}
      <div style={{ position: 'absolute', left: 0, right: 0, top: 820, textAlign: 'center', color: C.white, font: `400 30px ${FPX}`, opacity: promptO }}>화면을 눌러 셔터 올리기</div>
      {/* HUD */}
      <div style={{ position: 'absolute', left: 28, top: 28, display: 'flex', gap: 12, opacity: hudO }}>
        <HudChip><Coin s={2.5} /><span style={{ color: C.gold2 }}>{d.price}</span></HudChip>
        <HudChip style={{ color: C.mist2 }}>{t >= Ct ? d.pityAfter : d.pity}</HudChip>
        {reduced ? <HudChip style={{ color: C.lime }}>움직임 줄이기 켜짐</HudChip> : null}
      </div>
      <button onClick={d.onSkip} style={{ position: 'absolute', right: 28, top: 28, opacity: hudO * (1 - seg(t, Ct, Ct + 0.2)), border: 0, background: 'none', padding: 0, cursor: 'pointer', pointerEvents: t < Ct ? 'auto' : 'none' }}>
        <HudChip style={{ gap: 8 }}>건너뛰기 <span style={{ color: C.blue3 }}>▶▶</span></HudChip>
      </button>
      <ResultCard t={t} tier={tier} Ct={Ct} reduced={reduced} d={d} />
      <Sfx t={t} cues={sfxCues} on={sfx} />
    </div>
  );
}

// ── shop map ─────────────────────────────────────────────────────
function ShopMap({ lv = 1, fenced = true, plankT = -1, back = 0, newLot = 0, slotOn = [0, 0], glow = [0, 0], bSquash = [1, 1], bOrigin }) {
  return (
    <div style={{ position: 'relative', width: 1000, height: 720 }}>
      <MapL name="ground" />
      <MapL name="newLot" style={{ opacity: newLot }} />
      {[0, 1].map(i => <MapL key={'s' + i} name={'slot' + i} style={{ opacity: slotOn[i] }} />)}
      {[0, 1].map(i => <MapL key={'g' + i} name={'glow' + i} style={{ opacity: glow[i] }} />)}
      {fenced ? <MapL name="fenceBack" style={{ opacity: 1 - back, transform: `translateY(${back * 24}px)` }} /> : null}
      <div style={{ position: 'absolute', inset: 0, transform: `scale(${bSquash[0]},${bSquash[1]})`, transformOrigin: bOrigin || '560px 530px' }}>
        <MapL name="bld1" style={{ opacity: lv === 1 ? 1 : 0 }} />
        <MapL name="bld2" style={{ opacity: lv === 2 ? 1 : 0 }} />
      </div>
      {fenced ? FRONT_PLANKS.map((p, i) => {
        let tr = 'none', o = 1;
        if (plankT >= 0) {
          const t0 = i * 0.035, L = Math.max(0, plankT - t0), vx = (rnd(i, 30) - 0.35) * 320, vy = -(320 + rnd(i, 31) * 220), r = (rnd(i, 32) - 0.5) * 900;
          if (plankT >= t0) { tr = `translate(${vx * L}px,${vy * L + 0.5 * 1600 * L * L}px) rotate(${snap(r * L, 15)}deg)`; o = 1 - seg(L, 0.35, 0.6); }
        }
        return <MapL key={'p' + i} name={'plank' + i} style={{ transform: tr, transformOrigin: `${p.c[0]}px ${p.c[1]}px`, opacity: o }} />;
      }) : null}
      <MapL name="deco" />
    </div>
  );
}

function Expand({ t, sfx = true, d }) {

  const fc = mpos(6.8, 7.5, 0.5);

  const lv = t >= 1.45 ? 2 : 1;
  const glowAt = i => { const a = 1.0 + i * 0.2; return t < a ? 0 : (t < a + 0.12 ? seg(t, a, a + 0.12) : lerp(1, 0.35, seg(t, a + 0.12, a + 0.6))); };
  const dust = [];
  if (t > 0.42 && t < 1.3) for (let i = 0; i < 30; i++) {
    const p = MOTION.enter(t, 0.42 + rnd(i, 50) * 0.15, 1.2), a = rnd(i, 51) * Math.PI * 2, d = 40 + rnd(i, 52) * 160;

        <ShopMap lv={lv} plankT={t >= 0.4 ? t - 0.4 : -1} back={seg(t, 0.45, 0.75)} newLot={seg(t, 0.9, 1.1)} slotOn={[seg(t, 1.0, 1.1), seg(t, 1.2, 1.3)]} glow={[glowAt(0), glowAt(1)]} bSquash={sq} bOrigin={bo} />
        {dust}
        {burst(t, 1.47, 16, 560, 380, 170, [C.gold2, C.white], 70, true)}
      </div>
      <div style={{ position: 'absolute', left: 0, right: 0, top: 96, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14, opacity: seg(t, 1.7, 1.8) }}>
        <div style={{ padding: '14px 44px', background: C.blue, color: C.gold2, font: `400 56px ${FPX}`, borderRadius: 14, boxShadow: `0 0 0 4px ${C.ink}, inset 0 -8px 0 ${C.blueD}`, transform: `scale(${bandP})` }}>가게 Lv{d.lv}!</div>

      </div>
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: 56, display: 'flex', justifyContent: 'center' }}>
        <Btn label="확인" primary sc={btnP} o={seg(t, 1.95, 2.05)} style={{ width: 280 }} onClick={d.onClose} />

      <Sfx t={t} cues={[[0.4, '판자 탁탁'], [1.0, '칸 띵'], [1.45, '건물 뿅'], [1.7, '레벨업']]} on={sfx} />
    </div>
  );
}

// ── first grant ──────────────────────────────────────────────────

  const count = Math.round(d.money * MOTION.enter(t, 0.45, 1.15));
  const cards = [0, 1, 2].map(i => ({ p: MOTION.pop(t, i * 0.15, i * 0.15 + 0.4), o: seg(t, i * 0.15, i * 0.15 + 0.1), x: 250 + i * 300 }));
  const coins = [];
  for (let j = 0; j < 10; j++) {
    const L = t - (0.45 + j * 0.05); if (L < 0 || L > 0.7) continue;
    const vx = (rnd(j, 80) - 0.5) * 380, vy = -(560 + rnd(j, 81) * 240);
    const sp = Math.abs(Math.cos(L * 14 + j)), sx = sp > 0.66 ? 1 : sp > 0.33 ? 0.6 : 0.25;
    coins.push(<div key={'c' + j} style={{ position: 'absolute', left: snap(380 - 20 + vx * L), top: snap(410 + vy * L + 0.5 * 1700 * L * L), transform: `scaleX(${sx})`, opacity: 1 - seg(L, 0.5, 0.7) }}><Coin s={3.5} /></div>);
  }
  const hop = t < 0.95 ? 26 * Math.sin(Math.PI * seg(t, 0.75, 0.95)) : 12 * Math.sin(Math.PI * seg(t, 0.95, 1.12));

    <div key={'k' + i} style={{ position: 'absolute', left: cards[i].x, top: 290, width: 260, height: 360, borderRadius: 24, background: C.navy, boxShadow: `0 0 0 2px ${C.slate}`, transform: `translateY(${(1 - cards[i].p) * 160}px)`, opacity: cards[i].o, overflow: 'hidden' }}>{children}</div>
  );
  const label = (a, b) => <div style={{ position: 'absolute', left: 0, right: 0, top: 236, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}><div style={{ color: C.mist, font: `500 18px ${FUI}` }}>{a}</div><div style={{ color: C.white, font: `400 34px ${FPX}` }}>{b}</div></div>;
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}>
      <Backdrop />
      <div style={{ position: 'absolute', left: 0, right: 0, top: 150, textAlign: 'center', color: C.white, font: `400 44px ${FPX}`, opacity: seg(t, 0, 0.25), transform: `translateY(${(1 - MOTION.enter(t, 0, 0.35)) * -20}px)` }}>가게 오픈 선물이 도착했어요</div>
      {card(0, [<div key="a" style={{ position: 'absolute', left: 82, top: 70 }}><Coin s={8} /></div>, <div key="b">{label('게임머니', count.toLocaleString('en-US'))}</div>])}
      {card(1, [<div key="a" style={{ position: 'absolute', left: 130 - d.car.w * 1.5, top: 215 - d.car.h * 3 + -hop }}><OurCar car={d.car} s={3} /></div>,
        <div key="k" style={{ position: 'absolute', left: 170, top: 168, transform: `rotate(${-20 + 20 * MOTION.pop(t, 0.55, 0.85)}deg)` }}><Pix id="key" mk={keySVG} w={18} h={10} s={4} /></div>,
        <div key="b">{label('첫 차', d.name)}</div>])}
      {card(2, [<div key="a" style={{ position: 'absolute', left: 31, top: 60 }}>
          <Pix id="slots" mk={() => slotsSVG(-1)} w={66} h={38} s={3} />
          {[0, 1, 2].map(n => <Pix key={n} id={'slotg' + n} mk={() => slotsSVG(n)} w={66} h={38} s={3} style={{ position: 'absolute', left: 0, top: 0, opacity: seg(t, 0.7 + n * 0.1, 0.78 + n * 0.1) * 0.75 }} />)}
        </div>, <div key="b">{label('주차 칸', '차고 3칸')}</div>])}
      {coins}
      {t > 0.6 && t < 1.05 ? [0, 1, 2].map(i => <Star key={'ks' + i} x={cards[1].x + 190 + [0, 40, -10][i]} y={290 + 170 + [-20, 4, 26][i]} s={4} c={C.gold2} o={Math.sin(Math.PI * seg(t, 0.6 + i * 0.08, 0.85 + i * 0.08))} />) : null}
      <div style={{ position: 'absolute', left: cards[1].x + 186, top: 300, padding: '8px 14px', borderRadius: 10, background: C.white, color: C.ink, font: `400 26px ${FPX}`, transform: `scale(${horn})`, transformOrigin: '0 100%', boxShadow: `0 0 0 3px ${C.ink}` }}>빵!</div>
      {confetti(t, 1.25, 26, 33)}
      <div style={{ position: 'absolute', left: 0, right: 0, top: 720, display: 'flex', justifyContent: 'center' }}>
        <Btn label="가게로 가기" primary sc={MOTION.pop(t, 1.45, 1.75)} o={seg(t, 1.45, 1.55)} style={{ width: 320 }} onClick={d.onClose} />
      </div>
      <Sfx t={t} cues={[[0, '카드 톡톡톡'], [0.45, '동전 짤랑'], [0.78, '경적 빵'], [1.25, '축하']]} on={sfx} />

}

// ── settlement coins ─────────────────────────────────────────────
const coinCount = amt => clamp(Math.round(amt / 84), 1, 12);
function Settle({ t, sfx = true, d }) {
  const ROWS = d.rows, start = d.start, end = [1180, 66], total = ROWS.reduce((a, r) => a + r[1], 0);
  const counts = ROWS.map(r => coinCount(r[1]));
  const list = [];
  ROWS.forEach((r, ri) => { for (let c = 0; c < counts[ri]; c++) list.push({ ri, t0: 0.15 + ri * 0.12 + c * 0.04, val: r[1] / counts[ri], sy: 360 + ri * 86, j: list.length }); });
  let arrived = 0, lastHit = -9;
  list.forEach(k => { if (t >= k.t0 + 0.5) { arrived += k.val; lastHit = Math.max(lastHit, k.t0 + 0.5); } });
  const bump = 1 + 0.12 * (1 - seg(t, lastHit, lastHit + 0.14));
  const money = Math.round(start + arrived);
  const press = t < 0.15 ? 1 - 0.06 * Math.sin(Math.PI * seg(t, 0, 0.15)) : 1;
  const sweep = seg(t, 1.05, 1.4);
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}>
      <Backdrop />
      <div style={{ position: 'absolute', right: 28, top: 28, transform: `scale(${bump})`, transformOrigin: '50% 50%' }}>
        <HudChip style={{ height: 76, padding: '0 26px', gap: 14, overflow: 'hidden', position: 'relative' }}>
          <Coin s={3.5} /><span style={{ color: C.gold2, font: `400 34px ${FPX}` }}>{money.toLocaleString('en-US')}</span>
          {sweep > 0 && sweep < 1 ? <div style={{ position: 'absolute', top: 0, bottom: 0, left: -40 + sweep * 300, width: 24, background: C.white, opacity: 0.55, transform: 'skewX(-20deg)' }}></div> : null}
        </HudChip>
      </div>
      <div style={{ position: 'absolute', left: 340, top: 200, width: 680, borderRadius: 24, background: C.navy, boxShadow: `0 0 0 2px ${C.slate}`, padding: '34px 44px', boxSizing: 'border-box', display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div style={{ color: C.white, font: `400 36px ${FPX}`, marginBottom: 10 }}>오늘의 정산</div>
        {ROWS.map((r, i) => {
          const gone = seg(t, 0.15 + i * 0.12, 0.15 + i * 0.12 + 0.3);
          return <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', height: 72, padding: '0 22px', borderRadius: 14, background: C.navy2 }}>
            <span style={{ color: C.mist2, font: `500 24px ${FUI}` }}>{r[0]}</span>
            <span style={{ color: C.gold2, font: `400 30px ${FPX}`, opacity: 1 - gone * 0.55 }}>+{r[1]}</span>
          </div>;
        })}
        <div style={{ display: 'flex', justifyContent: 'space-between', padding: '14px 22px 8px', color: C.white, font: `400 30px ${FPX}` }}><span>합계</span><span style={{ color: C.gold }}>+{total.toLocaleString('en-US')}</span></div>
        <Btn label="확인" primary sc={press} style={{ marginTop: 8 }} o={1 - seg(t, 0.2, 0.4) * 0.5} />
      </div>
      {list.map(k => {
        const L = (t - k.t0) / 0.5; if (L < 0 || L > 1) return null;
        const e = MOTION.enter(t, k.t0, k.t0 + 0.5) * 0.4 + L * 0.6;
        const s0 = [930, k.sy], c1 = [s0[0] - 60 - (k.j % 3) * 30, Math.min(s0[1], end[1]) - 120 - (k.j % 4) * 30];
        const x = (1 - e) * (1 - e) * s0[0] + 2 * (1 - e) * e * c1[0] + e * e * end[0], y = (1 - e) * (1 - e) * s0[1] + 2 * (1 - e) * e * c1[1] + e * e * end[1];
        const sp = Math.abs(Math.cos(L * 9 + k.j)), sx = sp > 0.66 ? 1 : sp > 0.33 ? 0.6 : 0.25;
        return <div key={'sc' + k.j} style={{ position: 'absolute', left: snap(x - 20), top: snap(y - 20), transform: `scaleX(${sx})` }}><Coin s={3.5} /></div>;
      })}
      {t > 1.0 ? [0, 1, 2].map(i => <Star key={'ss' + i} x={1240 + [-90, 10, 60][i]} y={66 + [-30, 34, -18][i]} s={4} c={C.gold2} o={Math.sin(Math.PI * seg(t, 1.05 + i * 0.07, 1.4 + i * 0.07))} />) : null}
      <Sfx t={t} cues={[[0, '확인 톡'], [0.65, '동전 짤랑 ×12'], [1.05, '합계 반짝']]} on={sfx} />
    </div>
  );
}


// ── 시제품용 재생기 ───────────────────────────────────────────────
const PIECE_DUR = { gacha: null, grant: 1.85, settle: 1.55, expand: 2.3 };
function MotionPlayer({ kind, d, reduced, onEnd }) {
  const [, tick] = React.useState(0);
  const st = React.useRef({ t0: performance.now(), offset: 0, tapped: false, waitFrom: null });
  const tier = kind === 'gacha' ? d.tier : null;
  const tm = tier ? gachaTimes(tier, reduced) : null;
  const clockT = () => (performance.now() - st.current.t0) / 1000 + st.current.offset;
  let t = clockT();
  if (tm && !reduced && !st.current.tapped && t > tm.O - 0.08) {           // 탭 대기: 예고 장면 반복
    if (st.current.waitFrom === null) st.current.waitFrom = performance.now();
    if (performance.now() - st.current.waitFrom > 3000) { st.current.tapped = true; st.current.offset -= (t - (tm.O - 0.08)); t = tm.O - 0.08; }
    else t = tm.W + ((t - tm.W) % (tm.O - 0.1 - tm.W));
  }
  if (!tm && reduced) t = PIECE_DUR[kind] + 0.2;
  React.useEffect(() => { let id; const f = () => { tick(n => n + 1); id = requestAnimationFrame(f); }; id = requestAnimationFrame(f); return () => cancelAnimationFrame(id); }, []);
  React.useEffect(() => { if (kind === 'settle' && t > PIECE_DUR.settle + 0.9 && !st.current.ended) { st.current.ended = true; onEnd && onEnd(); } });
  const tap = () => { if (tm && !st.current.tapped && clockT() > tm.W) { const cur = clockT(); st.current.tapped = true; st.current.offset += (tm.O - 0.08) - cur; } };
  const skip = () => { if (tm) { st.current.tapped = true; st.current.offset += (tm.C + 0.7) - clockT(); } };
  const dd = Object.assign({}, d, { onSkip: skip });
  const body = kind === 'gacha' ? <Gacha t={t} tier={tier} reduced={reduced} d={dd} sfx={false} />
    : kind === 'grant' ? <FirstGrant t={t} d={dd} sfx={false} />
    : kind === 'settle' ? <Settle t={t} d={dd} sfx={false} />
    : <Expand t={t} d={dd} sfx={false} />;
  const s = Math.min(window.innerWidth / SW, window.innerHeight / SH);
  return (
    <div onClick={tap} style={{ position: 'fixed', inset: 0, zIndex: 40, background: C.navy0, overflow: 'hidden' }} role="dialog" aria-modal="true" aria-label="연출">
      <div style={{ position: 'absolute', left: (window.innerWidth - SW * s) / 2, top: (window.innerHeight - SH * s) / 2, width: SW, height: SH, transform: `scale(${s})`, transformOrigin: '0 0', overflow: 'hidden' }}>{body}</div>
    </div>
  );
}
let motionRoot = null, motionHost = null;
window.closeMotion = () => { if (motionRoot) { motionRoot.unmount(); motionRoot = null; } if (motionHost) { motionHost.remove(); motionHost = null; } };
window.playMotion = (kind, d, opts = {}) => {
  window.closeMotion();
  const reduced = opts.reduced ?? (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  motionHost = document.createElement('div'); document.body.appendChild(motionHost);
  motionRoot = ReactDOM.createRoot(motionHost);
  motionRoot.render(<MotionPlayer kind={kind} d={d} reduced={reduced} onEnd={d.onClose} />);
};
window.MOTION_TIMES = { gachaTimes, TIERS };

</script>
