<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>렌터카 가게 시제품</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
/* 한 화면 게임 UI: 위 상태 바 · 가운데 화면 · 아래 탐색. 2차 시안 A의 어두운 둥근 카드와 파란 주요 버튼 */
:root{
  color-scheme:dark;
  --bg:#151a28; --card:rgba(18,22,34,.94); --card2:#1d2335; --line:#2c3349;
  --fg:#ffffff; --mut:#aab3c5; --accent:#2f6fe8; --accent-fg:#ffffff;
  --ok:#7ee2a6; --ok-bg:#1f3a2c; --warn:#ffd36b; --warn-bg:#3d3216; --bad:#ff9a8a; --bad-bg:#4a2026;
  --info:#9cc2ff; --info-bg:#1e2f57; --teal:#7fd8cf; --teal-bg:#173c3c;
  --r-common:#d6dce6; --r-adv:#68a0f0; --r-rare:#f08caa; --r-legend:#fcdc64;
  --font:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,select:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.px{image-rendering:pixelated}
.app{max-width:1360px;margin:0 auto;padding-block:12px 16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title{font-size:clamp(22px,2.4vw,30px);font-weight:900;margin:0}
.money{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:10px 18px;font-size:clamp(20px,2.2vw,28px);font-weight:900;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2a8,#fcdc64 45%,#c86e28);box-shadow:0 0 0 2px #6e4a38 inset;flex:none}
.coin.s{width:16px;height:16px}
.screen{flex:1;min-height:0}
.card{background:var(--card);border-radius:22px;padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.mut{color:var(--mut)}
.h2{font-size:22px;font-weight:900;margin:0}
.btn{min-height:52px;padding:0 22px;border-radius:14px;font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--line)}
.btn.p{background:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:2px 12px;border-radius:16px;font-size:15px;font-weight:700;white-space:nowrap}
.st-idle{background:var(--ok-bg);color:var(--ok)} .st-repair{background:var(--bad-bg);color:var(--bad)}
.st-rest{background:#2c3141;color:#c3c9d6} .st-rent{background:var(--info-bg);color:var(--info)}
.rar{border:2px dashed var(--r-common);color:#e8ecf3}
.rar.advanced{border:2px solid var(--r-adv);color:var(--info)}
.rar.rare{border:4px double var(--r-rare);color:var(--r-rare)}
.rar.legend{border:3px solid var(--r-legend);color:var(--r-legend);box-shadow:0 0 10px rgba(252,220,100,.45)}
.nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--card);border-radius:20px;padding:8px}
.nav button{min-height:56px;border-radius:14px;font-weight:700;font-size:16px;color:var(--mut)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff}
.notice{border-radius:16px;padding:12px 16px;font-weight:700}
.notice.warn{background:var(--warn-bg);color:var(--warn)} .notice.bad{background:var(--bad-bg);color:var(--bad)} .notice.info{background:var(--info-bg);color:var(--info)}
.bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:60px}
.bar>div{height:100%;background:#68a0f0}
/* 지도 */
.map{position:relative;width:100%;aspect-ratio:1536/1024;border-radius:22px;overflow:hidden;container-type:inline-size;background:#72a449;max-width:100%;isolation:isolate}  /* z-index가 지도 밖(시작화면 위)으로 새지 않게 */
.map img{position:absolute;display:block;max-width:none}
.map .full{inset:0;width:100%;height:100%;pointer-events:none}
.map .car{transform:translate(-50%,-50%) scaleX(-1);pointer-events:none}
.map .slotbtn{width:4.6%;height:7%;transform:translate(-50%,-50%)}
.map .lock{position:absolute;transform:translateX(-50%);background:rgba(41,55,78,.6);color:#f7faff;border-radius:3px;padding:2px 4px;font-size:clamp(6px,1.1cqw,13px);white-space:nowrap;pointer-events:none}
.map .actor{image-rendering:pixelated;pointer-events:none}
.map .sign{position:absolute;color:#fcdc64;font-weight:900;text-align:center;white-space:nowrap;transform-origin:0 0;line-height:1;text-shadow:0 1px 0 #1c1e2c}
.hud{position:absolute;display:flex;gap:8px;align-items:center;background:rgba(18,22,34,.9);border-radius:14px;padding:6px 12px;font-weight:700;font-size:clamp(12px,1.6cqw,18px)}
.ring{position:absolute;border-radius:50%;pointer-events:none}
.ring.common{border:2px dashed var(--r-common)} .ring.advanced{border:2px solid var(--r-adv);box-shadow:0 0 8px var(--r-adv)}
.ring.rare{border:4px double var(--r-rare)} .ring.legend{border:3px solid var(--r-legend);box-shadow:0 0 12px var(--r-legend)}
.slotbtn{position:absolute;border-radius:12px}
.shop{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.shop{grid-template-columns:1fr}}
/* 차 그림 */
.carpic{position:relative;height:120px;display:grid;place-items:center}
.carpic img{width:auto;height:112px}
.carpic .ring{display:none}   /* 차 카드의 희귀도 테두리는 차를 가려서 뺐다(2026-11-13). 희귀도는 옆 칩으로 보여 준다 */
.cars{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.slot-empty{border:3px dashed var(--line);border-radius:22px;display:grid;place-items:center;text-align:center;padding:18px;min-height:220px;color:var(--mut)}
.dex{overflow-x:auto}
.dex table{border-collapse:separate;border-spacing:6px;min-width:620px}
.dex td,.dex th{text-align:center}
.dex th{font-size:14px;color:var(--mut);font-weight:700}
.dexcell{width:110px;height:70px;border-radius:12px;background:var(--card2);display:grid;place-items:center;position:relative}
.dexcell img{width:84px}
.dexcell.unseen img{filter:brightness(0);opacity:.55}
.dexcell.seen img{filter:grayscale(1) brightness(.85);opacity:.7}
.dexcell .q{position:absolute;font-weight:900;font-size:22px;color:var(--mut)}
.tools{border:2px dashed #3a4258;background:transparent}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card2);border-radius:16px;padding:12px 16px;flex-wrap:wrap}
.item>div{min-width:0}
.overlay{position:fixed;inset:0;background:rgba(5,8,15,.72);display:grid;place-items:center;padding:20px;z-index:20}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto}
.big{font-size:clamp(28px,4vw,44px);font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0d111c;border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--card2);font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .45s ease-out}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}}

/* ── 시작화면: 1280×720 무대를 화면에 꽉 차게 키운다. 가운데 960px 안에 중요한 것을 둔다 ── */
.ts{position:fixed;inset:0;z-index:60;overflow:hidden;background:#86c05a;cursor:pointer;outline:none;transition:opacity .45s ease}
.ts.go{opacity:0;pointer-events:none}
.ts-stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.ts .map{position:absolute;left:0;top:-110px;width:1280px;max-width:none;border-radius:0;transform-origin:50% 62%;animation:tsCam 18s ease-in-out infinite alternate}
.ts.go .map{animation:none;transform:scale(1.14);transition:transform .5s cubic-bezier(.5,0,.75,0)}
@keyframes tsCam{from{transform:translate(0,0) scale(1)}to{transform:translate(-26px,-10px) scale(1.04)}}
.ts-road{position:absolute;inset:0}
.ts-cloud{position:absolute;left:0;image-rendering:pixelated;animation:tsDrift linear infinite}
@keyframes tsDrift{from{transform:translateX(-360px)}to{transform:translateX(1500px)}}
.ts-shade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 620px 400px at 330px 190px,rgba(12,16,32,.62),rgba(12,16,32,0) 72%),
             linear-gradient(to top,rgba(12,16,32,.55),rgba(12,16,32,0) 26%)}
.ts-logo{position:absolute;left:172px;top:58px;width:560px;display:flex;flex-direction:column;align-items:flex-start;animation:tsIn .8s cubic-bezier(.34,1.56,.64,1) both}
.ts-float{animation:tsFloat 3.2s ease-in-out .8s infinite}
@keyframes tsIn{from{opacity:0;transform:translateY(-70px) scale(1.25)}to{opacity:1;transform:none}}
@keyframes tsFloat{50%{transform:translateY(-6px)}}
.ts-badge{display:flex;align-items:center;gap:8px;margin:0 0 6px 10px;padding:6px 14px 6px 8px;border-radius:999px;background:#1c1e2c;color:#fcdc64;font:700 15px/1 var(--font);letter-spacing:.18em;box-shadow:0 0 0 3px #fcdc64}
.ts-word{position:relative;display:block;font:400 136px/1.02 'Black Han Sans',var(--font);letter-spacing:-.01em;white-space:nowrap;transform:rotate(-4deg);transform-origin:0 50%}
.ts-word + .ts-word{margin:-14px 0 0 64px}
.ts-word span{display:block}
.ts-word .bk{position:absolute;inset:0;color:#1c1e2c;-webkit-text-stroke:22px #1c1e2c;text-shadow:0 12px 0 #1c1e2c}
.ts-word .fg{position:relative;-webkit-background-clip:text;background-clip:text;color:transparent}
.ts-word .sh{position:absolute;inset:0;-webkit-background-clip:text;background-clip:text;color:transparent;
  background-image:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%);background-size:300% 100%;background-position:100% 0;animation:tsShine 4.2s ease-in-out 1.2s infinite}
@keyframes tsShine{0%{background-position:100% 0}35%,100%{background-position:0 0}}
.ts-gold .fg{background-image:linear-gradient(#fff7c8 8%,#fcdc64 46%,#f6a83c 92%)}
.ts-sky .fg{background-image:linear-gradient(#ffffff 10%,#cfe4ff 50%,#68a0f0 94%)}
.ts-ribbon{position:relative;margin:18px 0 0 40px;padding:10px 46px;background:#2f6fe8;color:#fff;font:900 24px/1.2 var(--font);white-space:nowrap;
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 50%,100% 100%,0 100%,18px 50%);box-shadow:inset 0 -5px 0 #1d4fb4;animation:tsRib .5s ease-out .55s both}
@keyframes tsRib{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.ts-spark{position:absolute;width:22px;height:22px;background:#fff7c8;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tsTw 1.8s ease-in-out infinite}
@keyframes tsTw{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
.ts-start{position:absolute;left:640px;bottom:74px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:16px 34px;border-radius:999px;
  background:rgba(18,22,34,.86);box-shadow:0 0 0 3px rgba(255,255,255,.18),0 8px 0 rgba(12,16,32,.45);color:#fff;font:900 28px/1 var(--font);white-space:nowrap;animation:tsFade .5s ease 1.1s both}
.ts-start i{display:block;width:0;height:0;border-left:16px solid #fcdc64;border-top:10px solid transparent;border-bottom:10px solid transparent;animation:tsNudge 1.1s ease-in-out infinite}
.ts-start b{animation:tsPulse 1.4s ease-in-out infinite}
@keyframes tsFade{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes tsPulse{50%{opacity:.55}}
@keyframes tsNudge{50%{transform:translateX(5px)}}
.ts-foot{position:absolute;bottom:22px;color:rgba(255,255,255,.78);font:700 15px/1 var(--font);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.ts-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.ts.go .ts-flash{animation:tsFlash .14s ease-out}
.ts.go .ts-logo{animation:none;transform:scale(1.06);opacity:0;transition:.35s ease-in}
@keyframes tsFlash{40%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.ts *{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <div class="top">
    <h1 class="title" id="scrTitle">렌터카 가게</h1>
    <div class="row" style="gap:8px"><button class="btn" id="snd" data-act="sound" aria-pressed="true" title="소리 켜기/끄기" style="min-height:44px;padding:0 14px">🔊</button>
    <div class="money" aria-label="보유 게임머니"><span class="coin"></span><span id="money">0</span></div></div>
  </div>
  <main class="screen" id="screen"></main>
  <nav class="nav" id="nav" aria-label="화면 이동"></nav>
</div>
<div id="layer"></div>
<div class="ts" id="title" role="button" tabindex="0" aria-label="르르르 렌터카. 눌러서 시작" hidden>
  <div class="ts-stage" id="tsStage"></div>
</div>

<script>
const IMG = {{img}};   // 마을 한 장·차 20종·사람·르르르(경민 #229 시안). 층별 키트는 원본이 오면 바꿔 끼운다
const SPR = {{spr}};   // 그림 원본 크기 [w,h]
const MW = 1536, MH = 1024;   // 마을 그림 크기. 지도 위 좌표는 전부 이 기준
const SLOTS = [{x:253,y:635},{x:326,y:672},{x:400,y:709},{x:474,y:745},{x:548,y:781},{x:984,y:758},{x:1063,y:796},{x:1142,y:835},{x:1220,y:873},{x:1299,y:912}]; // 주차 칸 가운데

// ── 콘텐츠(PRD 시험값) ──
const MODELS = [
 ["hyundai_casper","캐스퍼",100,1],["hyundai_venue","베뉴",110,1],["hyundai_kona","코나",130,1],
 ["hyundai_avante","아반떼",120,1],["hyundai_sonata","쏘나타",150,1],["hyundai_tucson","투싼",150,1],
 ["hyundai_staria_tourer","스타리아 투어러",170,1],["hyundai_casper_electric","캐스퍼 일렉트릭",130,1],
 ["hyundai_grandeur","그랜저",200,2],["hyundai_santafe","싼타페",180,2],["hyundai_staria_lounge","스타리아 라운지",200,2],
 ["hyundai_ioniq5","아이오닉 5",180,2],["hyundai_ioniq6","아이오닉 6",180,2],["hyundai_nexo","넥쏘",220,2],
 ["genesis_g80","G80",240,3],["hyundai_palisade","팰리세이드",230,3],["genesis_gv70","GV70",240,3],
 ["hyundai_ioniq9","아이오닉 9",250,3],["genesis_g90","G90",300,4],["genesis_gv80","GV80",280,4]
].map(([id,name,ratio,unlock])=>({id,name,ratio,unlock,price:Math.floor(1000*ratio/100)}));   // 차종마다 전용 그림이라 색 변환은 없앴다
const M = Object.fromEntries(MODELS.map(m=>[m.id,m]));
const RAR = [
 {k:"common",n:"일반",w:747,inc:1.0,cost:100,prog:100},{k:"advanced",n:"고급",w:200,inc:1.1,cost:105,prog:150},
 {k:"rare",n:"희귀",w:50,inc:1.2,cost:110,prog:250},{k:"legend",n:"전설",w:3,inc:1.3,cost:115,prog:400}];
const R = Object.fromEntries(RAR.map(r=>[r.k,r]));
const CAP = {1:3,2:5,3:7,4:10};
const EXPAND = {2:{cust:3,cost:500},3:{cust:10,cost:1500},4:{cust:25,cost:3000}};
const TICKET = 500, PITY = 30, KM_PAY = 10, KM_CAP = 500;
const DEST = [{k:"mart",n:"마트",km:4,band:"근거리"},{k:"school",n:"학교",km:18,band:"중거리"},{k:"home",n:"본가",km:46,band:"원거리"}];

// ── 상태 ──
let S, seq = 0;
function fresh(){ return {started:false, money:0, level:1, customers:0, earned:0, km:0, kmToday:0, day:1,
  cars:[], hold:null, dex:{}, free:0, pity:0, gifted:false, firstRental:false, unread:[], log:[], delivery:null, offers:null, dest:null}; }
function save(){ try{ localStorage.setItem("rentShop", JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem("rentShop")); if(v && v.cars) return v; }catch(e){} return null; }
S = load() || fresh();
seq = S.cars.reduce((a,c)=>Math.max(a,+c.id.split("-")[1]||0),0);

const won = n => n.toLocaleString("ko-KR");
const cap = () => CAP[S.level];
const unlocked = () => MODELS.filter(m=>m.unlock<=S.level);
const see = (model,rar,owned) => { const k=model+"|"+rar; if(owned) S.dex[k]="owned"; else if(!S.dex[k]) S.dex[k]="seen"; };
function addCar(model,rar,cost,src){ const c={id:"car-"+(++seq),model,rar,lv:1,prog:0,acc:0,cost,st:"idle",rest:false,src};
  see(model,rar,true); if(S.cars.length<cap()){ S.cars.push(c); return "garage"; } S.hold={car:c,day:S.day}; return "hold"; }
function income(src,amount,text){ if(amount>0){ S.money+=amount; S.earned+=amount; } S.unread.push({src,amount,text}); }

// ── 규칙(PRD 시험값) ──
const lvCost = c => Math.floor(M[c.model].price*2*c.lv*R[c.rar].cost/10000);
const repairCost = c => Math.floor(M[c.model].price*5*R[c.rar].cost/10000);
const salePct = c => Math.max(60-5*c.acc,30) + (c.lv-1);
const salePrice = c => Math.floor(c.cost*salePct(c)/100);
const scrapPrice = c => Math.floor(c.cost*20/100);
function gainProg(c,pct){ let p=c.prog+pct; while(p>=100 && c.lv<20){ p-=100; c.lv++; } c.prog = c.lv>=20?0:p; }
function rollRar(){ if(S.pity>=PITY-1){ return Math.random()<50/53?"rare":"legend"; }
  let x=Math.random()*1000; for(const r of RAR){ if((x-=r.w)<0) return r.k; } return "common"; }

// ── 화면 공통 ──
const NAV = [["shop","가게"],["garage","차고"],["dex","도감"],["gacha","뽑기"],["delivery","탁송"],["settle","정산"],["rank","랭킹"]];
let view = "shop", detailId = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function carImg(model,cls="px"){ return `<img class="${cls}" src="${IMG[model]}" alt="${esc(M[model].name)}">`; }
function rarChip(k){ return `<span class="chip rar ${k}">${R[k].n}</span>`; }
function stChip(c){ if(c.st==="repair") return `<span class="chip st-repair">수리 필요</span>`;
  if(c.rest) return `<span class="chip st-rest">영업 쉬기</span>`; return `<span class="chip st-idle">대기</span>`; }
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
function modal(html){ $("#layer").innerHTML=`<div class="overlay" id="ov"><div class="card modal pop" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeModal(); }); }
function closeModal(){ $("#layer").innerHTML=""; }
function go(v){ view=v; detailId=null; render(); window.scrollTo(0,0); }

function render(){
  save();
  $("#money").textContent = won(S.money); $("#snd").textContent = AU.on?"🔊":"🔇"; $("#snd").setAttribute("aria-pressed", AU.on);
  bgm(S.started?view:"shop");
  if(!S.started){ $("#nav").hidden=true; $("#scrTitle").textContent="첫 실행"; return renderOnboarding(); }
  $("#nav").hidden=false;
  $("#nav").innerHTML = NAV.map(([k,n])=>`<button data-go="${k}" ${view===k||(view==="detail"&&k==="garage")?'aria-current="page"':""}>${n}${k==="settle"&&S.unread.length?` · ${S.unread.length}`:""}</button>`).join("");
  const titles={shop:"가게",garage:"차고",detail:"차량 상세",dex:"도감",gacha:"뽑기",delivery:"탁송",settle:"정산",rank:"랭킹"};
  $("#scrTitle").textContent = titles[view];
  ({shop:renderShop,garage:renderGarage,detail:renderDetail,dex:renderDex,gacha:renderGacha,delivery:renderDelivery,settle:renderSettle,rank:renderRank})[view]();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-go],[data-act]"); if(!b || b.disabled) return;
  if(b.dataset.act!=="sound") sfx("click");
  if(b.dataset.go){ go(b.dataset.go); return; }
  ACT[b.dataset.act](b.dataset.arg, b);
});

       <div class="item" style="display:block"><div class="mut">차종 가격</div><b>${won(m.price)}</b></div></div>

     ${row("수리", busyRepair?`${won(m.price)} × 5% × ${R[c.rar].cost/100}`:"지금은 수리할 곳이 없어요", repairCost(c),

function makeOffers(d, downgrade){
  const pool=unlocked(), pick=()=>pool[Math.floor(Math.random()*pool.length)];
  const rar=()=>{ let k=rollRarSimple(); if(downgrade){ const i=RAR.findIndex(r=>r.k===k); k=RAR[Math.max(0,i-1)].k; } return k; };
  return [0,1,2,3].map(i=>{ const m=pick(), r=rar(), kind=i<2?"profit":"buy";
    see(m.id,r,false);
    return {id:"o"+Date.now()+i, kind, model:m.id, rar:r, km:d.km, dest:d.n,
      reward: kind==="profit"? Math.round((80 + d.km*8)*R[r].inc/10)*10 : null,
      price: kind==="buy"? Math.round(m.price*(1+RAR.findIndex(x=>x.k===r)*.25)/10)*10 : null}; });
}
function rollRarSimple(){ let x=Math.random()*1000; for(const r of RAR){ if((x-=r.w)<0) return r.k; } return "common"; }

const TIER_OF = {common:"common", advanced:"uncommon", rare:"rare", legend:"legend"};
const carData = id => ({src:IMG[id], w:SPR[id][0], h:SPR[id][1]});
const canMotion = () => typeof window.playMotion === "function";
function gachaMotion(kind, r, m, isNew, guaranteed, pityBefore){
  window.playMotion("gacha", {tier:TIER_OF[r], name:m.name, car:carData(m.id), isNew, guaranteed, price:kind==="free"?"무료권":String(TICKET),
    pity:`희귀 이상 보장까지 ${PITY-pityBefore}회`, pityAfter:`다음 보장까지 ${PITY-S.pity}회`,
    againPrice: S.free>0?"무료권":String(TICKET),
    canAgain: S.cars.length<cap() && (S.free>0 || S.money>=TICKET),
    onAgain:()=>{ window.closeMotion(); ACT.pull(S.free>0?"free":"paid"); },
    onGarage:()=>{ window.closeMotion(); go("garage"); }});
}

// ── 소리: 효과음은 WebAudio로 즉석에서 만들고, 브금은 옆 폴더 bgm/의 mp3를 읽는다(없으면 조용히 넘어감) ──
const AU = {ctx:null, on: localStorage.getItem("rentSound")!=="off"};
function tone(f, at, dur, type="square", vol=.12, slide=0){ if(!AU.on) return; try{ AU.ctx = AU.ctx || new (window.AudioContext||window.webkitAudioContext)(); if(AU.ctx.state==="suspended") AU.ctx.resume(); }catch(e){ return; }
  const c=AU.ctx, t0=c.currentTime+at, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); if(slide) o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur); o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.02); }
const SFX = {   // 픽셀 게임풍 짧은 소리. 실제 효과음 파일이 오면 이 표만 바꾼다
  click: ()=>tone(880,0,.05,"square",.06), coin: ()=>{ tone(1047,0,.08,"square",.1); tone(1568,.08,.16,"square",.1); },
  shutter: ()=>tone(110,0,.3,"sawtooth",.18,-70), whoosh: ()=>tone(300,0,.3,"sine",.1,900), pop: ()=>tone(400,0,.12,"square",.12,500),
  chime: n=>tone(660*Math.pow(1.19,n||0),0,.25,"triangle",.12), sparkle: ()=>[0,.06,.12].forEach((d,i)=>tone(1760+i*440,d,.14,"triangle",.08)),
  fanfare: ()=>[[523,0],[659,.12],[784,.24],[1047,.36]].forEach(([f,d])=>tone(f,d,.32,"square",.1)),
  levelup: ()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.07,.16,"square",.1)), ding: ()=>tone(1319,0,.35,"triangle",.1),
  knock: ()=>[0,.09,.18].forEach(d=>tone(150,d,.06,"square",.12)), tick3: ()=>[0,.1,.2].forEach(d=>tone(1200,d,.03,"square",.07)),
  horn: ()=>{ tone(440,0,.2,"sawtooth",.1); tone(554,0,.2,"sawtooth",.08); }, depart: ()=>tone(120,0,.55,"sawtooth",.12,90), bad: ()=>tone(220,0,.22,"square",.1,-90) };
const CUE = [[/셔터 쿵/,"shutter"],[/셔터 열림|휘익/,"whoosh"],[/승급 차임 (\d)/,"chime"],[/팡파르|축하/,"fanfare"],[/반짝/,"sparkle"],[/판자/,"knock"],[/띵/,"ding"],[/뿅/,"pop"],[/레벨업/,"levelup"],[/톡톡/,"tick3"],[/톡/,"click"],[/동전/,"coin"],[/경적/,"horn"]];
function sfx(name){ if(SFX[name]) return SFX[name](); for(const [re,k] of CUE){ const m=re.exec(name); if(m) return SFX[k](m[1]&&+m[1]); } }   // 연출의 SFX 자리 글귀도 받는다
window.sfx = sfx;
const BGM = {el:Object.assign(new Audio(),{loop:true,volume:.45}), cur:null,
  of:{title:"title", shop:"shop", garage:"shop", detail:"shop", dex:"shop", rank:"shop", gacha:"gacha", delivery:"delivery", settle:"settle"}};
BGM.el.addEventListener("error", ()=>{ BGM.cur=null; });   // 파일이 없으면 조용히 넘어간다
function bgm(view){ const name=BGM.of[view]||"shop"; if(!AU.on){ BGM.el.pause(); BGM.cur=null; return; }
  if(BGM.cur===name) return; BGM.cur=name; BGM.el.src=`bgm/${name}.mp3`; BGM.el.play().catch(()=>{}); }   // 첫 손길 전엔 play()가 거부돼도 그냥 넘어간다

// ── 동작 ──
const ACT = {
  sound(){ AU.on=!AU.on; localStorage.setItem("rentSound", AU.on?"on":"off"); BGM.cur=null; if(AU.on) sfx("pop"); render(); },   // render()가 화면에 맞는 브금을 다시 튼다
  obNext(){ ob.step++; render(); }, obBack(){ ob.step=1; render(); }, obPick(id){ ob.pick=id; render(); },
  obGrant(){ S=fresh(); S.money=1000; S.earned=0; addCar(ob.pick,"common",0,"첫 지급"); ob.step=3; render();
    if(canMotion()) window.playMotion("grant",{money:1000, name:M[ob.pick].name, car:carData(ob.pick), onClose:()=>{ window.closeMotion(); ACT.obDone(); }}); },
  obDone(){ S.started=true; ob.step=0; view="shop"; render(); },
  openCar(id){ detailId=id; view="detail"; render(); window.scrollTo(0,0); },
  expand(){ const n=EXPAND[S.level+1], from=cap(); S.money-=n.cost; S.level++; render();
    if(canMotion()) window.playMotion("expand",{lv:S.level, from, to:cap(), onClose:()=>window.closeMotion()}); else toast(`가게 Lv${S.level}이 되었어요 · 주차 ${cap()}칸`); },
  hour(){ let n=0;
    for(const c of S.cars){ if(c.st!=="idle"||c.rest) continue; if(Math.random()>.45) continue;
      const m=M[c.model]; const hours=1+Math.floor(Math.random()*3);
      let fee=Math.round(100*hours*(1+(m.ratio/100-1)*.25)*R[c.rar].inc*(1-Math.min(.15,.03*c.acc)));
      let text=`${m.name} ${hours}시간 대여`;
      if(Math.random()<.03){ fee=Math.round(fee*.5); c.acc++; c.st="repair"; text+=" · 사고: 수익 50%, 수리 필요"; }
      S.customers++; n++; income("rental",fee,text); S.log.push({text,amount:fee});
      if(!S.firstRental){ S.firstRental=true; if(!S.gifted){ S.gifted=true; S.free++; S.unread.push({src:"gift",amount:0,text:"첫 영업을 마쳤어요 · 개업 선물: 무료 뽑기권 1장"}); setTimeout(giftModal,50); } } }
    sfx(n?"coin":"bad"); toast(n?`손님 ${n}명이 차를 빌려 갔어요 · 정산에서 확인하세요`:"이번 시간엔 손님이 없었어요"); render(); },
  drive(){ const km=Math.min(30, KM_CAP-S.kmToday); S.km+=30;
    if(km<=0){ toast("오늘은 하루 최대 500km를 넘어서 주행 수익이 더 쌓이지 않아요"); return render(); }
    S.kmToday+=km; const pay=km*KM_PAY; const text=`기본 주행 수익 · ${km}km × ${KM_PAY}`; income("drive",pay,text); S.log.push({text,amount:pay}); sfx("coin"); toast(`+${pay} · 정산에서 확인하세요`); render(); },
  arrive(){ const d=S.delivery; if(!d) return; const o=d.offer, m=M[o.model];
    if(o.kind==="profit"){ const text=`${m.name} 수익 탁송 · ${o.dest} 도착 완료`; income("delivery",o.reward,text); S.log.push({text,amount:o.reward}); }
    else { const where=addCar(o.model,o.rar,d.paid,"구매 탁송"); const text=`${m.name}(${R[o.rar].n}) 구매 탁송 도착 · ${where==="garage"?"차고에 들어갔어요":"차고가 꽉 차서 임시 보관함에 있어요"}`; income("delivery",0,text); S.log.push({text,amount:0}); }
    S.delivery=null; S.offers=null; sfx("coin"); toast("탁송을 마쳤어요 · 정산에서 확인하세요"); render(); },

// ── 마을 사람 (경로는 경민 #229·정원 #235 시안, 그림은 PNG로 교체) ──
const ACTORS = [
 {kind:"guest",a:[595,580],b:[825,695],dur:22,off:0},{kind:"guest",a:[745,750],b:[945,850],dur:24,off:8},
 {kind:"mechanic",a:[1175,660],b:[1285,715],dur:16,off:4},{kind:"fuel",a:[130,318],b:[300,302],dur:18,off:6},
 {kind:"mechanic",a:[720,595],b:[940,705],dur:21,off:11},   // 렌트카 직원 자리 → 정비사(2026-11-13 결정)
 {kind:"ruru",a:[670,665],b:[790,725],dur:20,off:2}];
// ponytail: 서로 비켜 서는 처리는 뺐다. 경로가 겹쳐 보이면 경민 시안의 advanceActors를 가져온다
const RURU = {walk:[1,2,3,4,5,6,7,8].map(i=>IMG["walk"+i]), idle:[5,5,3,4,5,5].map(i=>IMG["idle"+i])};
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const actorsHTML = () => ACTORS.map((p,i)=>`<img class="actor" data-actor="${i}" alt="" src="${p.kind==="ruru"?RURU.idle[0]:IMG[p.kind]}" style="width:${pct(p.kind==="ruru"?64:32,MW)}%">`).join("");
function pose(p, clock){ const ph=(clock/p.dur)%1; let t=0, walk=false, flip=false;   // a에서 쉬고 → b로 → 돌아서 쉬고 → a로
  if(ph<.1) t=0; else if(ph<.45){ t=(ph-.1)/.35; walk=true; } else if(ph<.6){ t=1; flip=ph>.53; } else if(ph<.95){ t=1-(ph-.6)/.35; walk=true; flip=true; }
  return {x:p.a[0]+(p.b[0]-p.a[0])*t, y:p.a[1]+(p.b[1]-p.a[1])*t, walk, flip}; }
const actorClock = {};   // 화면을 다시 그려도 걷던 자리에서 이어진다
function mountActors(map){ if(!map) return; const els=[...map.querySelectorAll("[data-actor]")]; let prev=performance.now();
  const tick=now=>{ if(!map.isConnected) return; const dt=reduceMotion()?0:Math.min((now-prev)/1000,.1); prev=now;
    els.forEach(el=>{ const i=+el.dataset.actor, p=ACTORS[i]; actorClock[i]=(actorClock[i]??p.off)+dt; const s=pose(p,actorClock[i]);
      el.style.left=mx(s.x); el.style.top=my(s.y); el.style.zIndex=100+Math.round(s.y);
      const bob = s.walk && p.kind!=="ruru" ? Math.floor(actorClock[i]*6)%2 : 0;
      el.style.transform=`translate(-50%,${-100-bob*2}%) scaleX(${s.flip?-1:1})`;
      if(p.kind==="ruru"){ const f=s.walk?RURU.walk[Math.floor(actorClock[i]*10)%8]:RURU.idle[Math.floor(actorClock[i]*2)%6]; if(el.src!==f) el.src=f; } });
    requestAnimationFrame(tick); };
  requestAnimationFrame(tick); }

function tsSpawn(lane, x){ const m = MODELS[Math.floor(Math.random()*MODELS.length)], img = document.createElement("img");
  img.src = IMG[m.id]; img.alt = ""; img.className = "car"; img.style.width = pct(SPR[m.id][0]*2,MW)+"%"; img.style.transform = "translate(-50%,-50%)";   // ↘ 진행이라 뒤집지 않는다

function tsPlace(c, t){ const y = LANES[c.lane].y0 + c.x/2;
  c.img.style.left = mx(c.x); c.img.style.top = my(y - 7 + Math.sin(t/80 + c.x)); c.img.style.zIndex = 100 + Math.round(y); }
function tsTick(t){ const dt = Math.min(.05, (t - (TS.last || t))/1000); TS.last = t;
  if(t > TS.next){ const lane = Math.random() < .5 ? 0 : 1, back = TS.cars.filter(c=>c.lane===lane).reduce((a,c)=>Math.min(a,c.x), 9999);
    if(back > 160) tsSpawn(lane, -120); TS.next = t + 1400 + Math.random()*2400; }
  TS.cars = TS.cars.filter(c=>{ c.x += LANES[c.lane].v*dt; tsPlace(c, t); if(c.x > 720){ c.img.remove(); return false; } return true; });
  TS.raf = requestAnimationFrame(tsTick); }
